<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cellix - Check Your Balance</title>
  <style>
    body{font-family:Arial,sans-serif;background:#eef6ff;margin:0;padding:30px;color:#17345f}
    .card{max-width:520px;margin:auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 35px #0001}
    h1{margin-top:0;color:#1477ed}.sub{color:#64748b}
    input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #d5dfeb;border-radius:12px;margin:8px 0 16px;font-size:16px}
    button{width:100%;padding:16px;border:0;border-radius:12px;background:#1477ed;color:white;font-size:17px;font-weight:bold}
    #result{margin-top:20px;padding:16px;background:#f7f9fc;border-radius:14px;display:none}
  </style>
</head>
<body>
  <div class="card">
    <h1>Cellix</h1>
    <h2>Check Your Unpaid Balance</h2>
    <p class="sub">Enter your phone number and full name.</p>
    <input id="phone" placeholder="Phone Number">
    <input id="name" placeholder="Full Name">
    <button onclick="checkBalance()">Check My Balance</button>
    <div id="result"></div>
  </div>
<script>
async function checkBalance(){
  const result=document.getElementById('result');
  result.style.display='block';
  result.textContent='Checking...';
  try{
    const r=await fetch('/api/check',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        phone:document.getElementById('phone').value.trim(),
        name:document.getElementById('name').value.trim()
      })
    });
    const d=await r.json();
    result.textContent=d.error || JSON.stringify(d);
  }catch(e){ result.textContent='Connection error.'; }
}
</script>
</body>
</html>
